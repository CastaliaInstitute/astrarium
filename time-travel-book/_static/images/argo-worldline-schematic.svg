<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="title desc">
  <title id="title">A.R.G.O. mission route through time</title>
  <desc id="desc">A schematic continuous curve links a present-day departure to an earlier Earth-date encounter. Arrowheads along the curve show the crew's clock moving forward. Axes and route are illustrative, not to scale.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop stop-color="#101b32"/><stop offset="1" stop-color="#1d3150"/></linearGradient>
    <linearGradient id="route" x1="0" x2="1"><stop stop-color="#70d6ff"/><stop offset="1" stop-color="#ffbd69"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#ffe09a"/></marker>
    <marker id="axisArrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M 0 0 L 10 5 L 0 10 z" fill="#d8e6f8"/></marker>
  </defs>
  <rect width="1000" height="470" rx="24" fill="url(#bg)"/>
  <g fill="#d8e6f8" opacity=".75"><circle cx="180" cy="67" r="2"/><circle cx="303" cy="92" r="1.5"/><circle cx="823" cy="71" r="2"/><circle cx="913" cy="154" r="1.5"/><circle cx="654" cy="80" r="1.5"/><circle cx="473" cy="61" r="1.2"/><circle cx="119" cy="174" r="1.4"/></g>
  <text x="56" y="55" fill="#fff" font-family="system-ui, sans-serif" font-size="23" font-weight="700">A.R.G.O.’s journey, drawn as one continuous line</text>
  <path d="M 127 335 L 127 117" fill="none" stroke="#d8e6f8" stroke-width="3" marker-end="url(#axisArrow)"/>
  <text x="72" y="100" fill="#d8e6f8" font-family="system-ui, sans-serif" font-size="17">Earth calendar</text>
  <text x="82" y="382" fill="#d8e6f8" font-family="system-ui, sans-serif" font-size="17">later</text>
  <text x="77" y="139" fill="#d8e6f8" font-family="system-ui, sans-serif" font-size="17">earlier</text>
  <path d="M 171 319 C 288 285 354 206 466 227 S 639 300 725 189 S 838 153 883 139" fill="none" stroke="url(#route)" stroke-width="9" stroke-linecap="round"/>
  <path d="M 292 274 C 328 250 357 222 390 220" fill="none" stroke="#ffe09a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 567 259 C 603 272 635 276 662 254" fill="none" stroke="#ffe09a" stroke-width="3" marker-end="url(#arrow)"/>
  <path d="M 747 185 C 777 160 805 148 831 145" fill="none" stroke="#ffe09a" stroke-width="3" marker-end="url(#arrow)"/>
  <circle cx="171" cy="319" r="12" fill="#70d6ff" stroke="#fff" stroke-width="3"/>
  <circle cx="883" cy="139" r="13" fill="#ffbd69" stroke="#fff" stroke-width="3"/>
  <text x="173" y="357" fill="#fff" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Start: present day</text>
  <text x="709" y="112" fill="#fff" font-family="system-ui, sans-serif" font-size="19" font-weight="700">Encounter: ancient Earth</text>
  <rect x="333" y="376" width="431" height="48" rx="24" fill="#283d5e" stroke="#7894b9"/>
  <text x="548" y="407" text-anchor="middle" fill="#fff1c5" font-family="system-ui, sans-serif" font-size="18">Crew’s own clock: forward along the whole route →</text>
  <text x="500" y="452" text-anchor="middle" fill="#c7d5e8" font-family="system-ui, sans-serif" font-size="14">Concept sketch only · axes not to scale · no route or engine has been calculated</text>
</svg>
