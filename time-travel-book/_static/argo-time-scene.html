<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>A.R.G.O. Solar-System Time Scene</title>
<style>
  :root { color-scheme: dark; font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; }
  * { box-sizing: border-box; }
  body { margin: 0; color: #e7edf4; background: #070b13; }
  #app { display: grid; grid-template-rows: auto minmax(400px, 1fr) auto auto; min-height: 720px; height: 100vh; max-height: 900px; }
  header { display: flex; gap: 16px; align-items: baseline; justify-content: space-between; padding: 14px 18px 8px; }
  header strong { font-weight: 600; letter-spacing: .02em; }
  #date { color: #aab8ca; font-variant-numeric: tabular-nums; }
  #viewport { position: relative; min-height: 400px; overflow: hidden; touch-action: none; }
  canvas { display: block; width: 100%; height: 100%; outline: none; }
  #legend { position: absolute; left: 16px; top: 12px; display: grid; gap: 7px; color: #c0cad8; font-size: 12px; pointer-events: none; }
  .key { display: flex; gap: 8px; align-items: center; }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--c); box-shadow: 0 0 9px color-mix(in srgb, var(--c), transparent 35%); }
  footer { display: grid; grid-template-columns: auto minmax(160px, 1fr); gap: 12px 18px; align-items: center; padding: 10px 18px 8px; border-top: 1px solid #263142; }
  button { color: #edf5ff; background: #172334; border: 1px solid #37465a; border-radius: 5px; padding: 9px 13px; font: inherit; cursor: pointer; }
  button:hover { background: #21334a; }
  label { display: grid; gap: 5px; color: #c0cad8; font-size: 13px; }
  input[type=range] { width: 100%; accent-color: #7de8df; }
  #status { grid-column: 1 / -1; min-height: 18px; margin: 0; color: #9caec2; font-size: 12px; line-height: 1.4; }
  @media (max-width: 480px) {
    #app { min-height: 700px; grid-template-rows: auto minmax(390px, 1fr) auto auto; }
    header { align-items: flex-start; flex-direction: column; gap: 3px; padding-inline: 12px; }
    footer { grid-template-columns: 1fr; padding-inline: 12px; gap: 8px; }
    #status { grid-column: 1; }
  }
</style>
</head>
<body>
<main id="app">
  <header>
    <strong>Solar system · A.R.G.O. route</strong>
    <span id="date" aria-live="polite">2026 CE</span>
  </header>
  <div id="viewport" role="img" aria-label="Interactive three-dimensional view of the Sun, planets, Moon, and A.R.G.O. mission curve">
    <div id="legend" aria-hidden="true">
      <span class="key"><i class="dot" style="--c:#7de8df"></i>A.R.G.O. mission curve</span>
      <span class="key"><i class="dot" style="--c:#e8bd74"></i>Planetary orbits</span>
    </div>
    <noscript>This interactive scene requires JavaScript and WebGL.</noscript>
  </div>
  <footer>
    <button id="play" type="button" aria-label="Play time progression">Play</button>
    <label for="year">Environment year · <output id="yearLabel">2026 CE</output>
      <input id="year" type="range" min="-2999" max="2026" step="1" value="2026">
    </label>
    <p id="status" aria-live="polite">A.R.G.O. is at the 2026 CE departure. Play or scrub backward toward the 6 BCE scenario endpoint; the route is illustrative and has not been collision-screened.</p>
  </footer>
</main>
<script type="module">
import * as THREE from "https://cdn.jsdelivr.net/npm/three@0.172.0/build/three.module.js";

const viewport = document.querySelector("#viewport");
const yearSlider = document.querySelector("#year");
const yearLabel = document.querySelector("#yearLabel");
const dateLabel = document.querySelector("#date");
const status = document.querySelector("#status");
const playButton = document.querySelector("#play");
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)");
const colors = { Mercury: 0xb9c2ce, Venus: 0xf1d9a5, Earth: 0x4c9be8, Mars: 0xe67b59, Jupiter: 0xe6c795, Saturn: 0xd8bf83, Uranus: 0x87d8d0, Neptune: 0x739bfa };
const radii = { Mercury: 0.09, Venus: 0.15, Earth: 0.17, Mars: 0.12, Jupiter: 0.38, Saturn: 0.32, Uranus: 0.24, Neptune: 0.23 };
const AU_SCALE = 2.0;
const DEG = Math.PI / 180;
const rad = (d) => d * DEG;
const modulo = (n, m) => ((n % m) + m) % m;

// JPL long-range approximate-element coefficients, arranged as
// a, da, e, de, i, di, L, dL, longitude of perihelion, dperi, node, dnode,
// and the optional quadratic/periodic corrections b, c, s, f.
const elements = {
  Earth: [1.00000018,-0.00000003,0.01673163,-0.00003661,-0.00054346,-0.01337178,100.46691572,35999.37306329,102.93005885,0.31795260,-5.11260389,-0.24123856],
  Mercury: [0.38709843,0,0.20563661,0.00002123,7.00559432,-0.00590158,252.25166724,149472.67486623,77.45771895,0.15940013,48.33961819,-0.12214182],
  Venus: [0.72332102,-0.00000026,0.00676399,-0.00005107,3.39777545,0.00043494,181.97970850,58517.81560260,131.76755713,0.05679648,76.67261496,-0.27274174],
  Mars: [1.52371243,0.00000097,0.09336511,0.00009149,1.85181869,-0.00724757,-4.56813164,19140.29934243,-23.91744784,0.45223625,49.71320984,-0.26852431],
  Jupiter: [5.20248019,-0.00002864,0.04853590,0.00018026,1.29861416,-0.00322699,34.33479152,3034.90371757,14.27495244,0.18199196,100.29282654,0.13024619,-0.00012452,0.06064060,-0.35635438,38.35125],
  Saturn: [9.54149883,-0.00003065,0.05550825,-0.00032044,2.49424102,0.00451969,50.07571329,1222.11494724,92.86136063,0.54179478,113.63998702,-0.25015002,0.00025899,-0.13434469,0.87320147,38.35125],
  Uranus: [19.18797948,-0.00020455,0.04685740,-0.00001550,0.77298127,-0.00180155,314.20276625,428.49512595,172.43404441,0.09266985,73.96250215,0.05739699,0.00058331,-0.97731848,0.17689245,7.67025],
  Neptune: [30.06952752,0.00006447,0.00895439,0.00000818,1.77005520,0.00022400,304.22289287,218.46515314,46.68158724,0.01009938,131.78635853,-0.00606302,-0.00041348,0.68346318,-0.10162547,7.67025]
};

function solveKepler(M, e) {
  const mr = modulo(M + 180, 360) - 180;
  const m = rad(mr);
  let E = m;
  for (let i = 0; i < 12; i++) E -= (E - e * Math.sin(E) - m) / (1 - e * Math.cos(E));
  return E;
}

function planetPosition(name, year, forcedMeanAnomaly = null) {
  const q = elements[name];
  const T = (year - 2000) / 100;
  const [a0, da, e0, de, i0, di, L0, dL, p0, dp, n0, dn, b=0, c=0, s=0, f=0] = q;
  const a = a0 + da*T, e = e0 + de*T, inc = i0 + di*T;
  const L = L0 + dL*T, peri = p0 + dp*T, node = n0 + dn*T;
  const M = forcedMeanAnomaly ?? (L - peri + b*T*T + c*Math.cos(rad(f*T)) + s*Math.sin(rad(f*T)));
  const E = solveKepler(M, e);
  const xp = a * (Math.cos(E) - e), yp = a * Math.sqrt(1-e*e) * Math.sin(E);
  const w = rad(peri - node), nr = rad(node), ir = rad(inc);
  const xv = xp*Math.cos(w) - yp*Math.sin(w), yv = xp*Math.sin(w) + yp*Math.cos(w);
  return [xv*Math.cos(nr) - yv*Math.sin(nr)*Math.cos(ir), xv*Math.sin(nr) + yv*Math.cos(nr)*Math.cos(ir), yv*Math.sin(ir)];
}

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x070b13);
const camera = new THREE.PerspectiveCamera(42, 1, 0.1, 400);
camera.position.set(65, 95, 95);
camera.lookAt(0, 0, 0);
const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: "high-performance" });
renderer.setPixelRatio(Math.min(devicePixelRatio || 1, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
viewport.prepend(renderer.domElement);
renderer.domElement.setAttribute("aria-hidden", "true");

scene.add(new THREE.AmbientLight(0xb8c5df, 1.25));
const sunLight = new THREE.PointLight(0xffedc2, 120, 0, 1.6);
scene.add(sunLight);

const stars = new Float32Array(1800 * 3);
let seed = 84117;
const rand = () => { seed = (seed * 1664525 + 1013904223) >>> 0; return seed / 4294967296; };
for (let i = 0; i < stars.length; i += 3) {
  const theta = rand()*Math.PI*2, z = rand()*2-1, r = 80+rand()*20, h = Math.sqrt(1-z*z);
  stars[i] = r*h*Math.cos(theta); stars[i+1] = r*z; stars[i+2] = r*h*Math.sin(theta);
}
const starGeo = new THREE.BufferGeometry(); starGeo.setAttribute("position", new THREE.BufferAttribute(stars, 3));
scene.add(new THREE.Points(starGeo, new THREE.PointsMaterial({ color: 0xa8bad6, size: 0.12, sizeAttenuation: true, transparent: true, opacity: 0.72 })));

const worldLinear = (p) => new THREE.Vector3(p[0]*AU_SCALE, p[2]*AU_SCALE, p[1]*AU_SCALE);
const world = (p) => {
  const r=Math.hypot(p[0],p[1],p[2]);
  const f=r===0?AU_SCALE:8*Math.log1p(r)/r;
  return new THREE.Vector3(p[0]*f,p[2]*f,p[1]*f);
};
const sun = new THREE.Mesh(new THREE.SphereGeometry(0.82, 40, 28), new THREE.MeshBasicMaterial({ color: 0xffd36f }));
scene.add(sun);
const glowCanvas=document.createElement("canvas"); glowCanvas.width=glowCanvas.height=128;
const glowCtx=glowCanvas.getContext("2d");
const glow=glowCtx.createRadialGradient(64,64,2,64,64,64);
glow.addColorStop(0,"rgba(255,214,132,0.42)"); glow.addColorStop(0.35,"rgba(255,184,92,0.14)"); glow.addColorStop(1,"rgba(255,160,64,0)");
glowCtx.fillStyle=glow; glowCtx.fillRect(0,0,128,128);
const glowTexture=new THREE.CanvasTexture(glowCanvas);
const sunGlow = new THREE.Sprite(new THREE.SpriteMaterial({ map:glowTexture, transparent:true, blending:THREE.AdditiveBlending, depthWrite:false }));
sunGlow.scale.set(5.2,5.2,1); scene.add(sunGlow);

function textSprite(text, color="#dbe8f7") {
  const c = document.createElement("canvas"); c.width = 320; c.height = 72;
  const x = c.getContext("2d"); x.font = "500 29px system-ui, sans-serif"; x.textAlign="center"; x.textBaseline="middle";
  x.shadowColor = "#07101e"; x.shadowBlur = 8; x.fillStyle = color; x.fillText(text, 160, 37);
  const texture = new THREE.CanvasTexture(c); texture.colorSpace = THREE.SRGBColorSpace;
  const sprite = new THREE.Sprite(new THREE.SpriteMaterial({ map: texture, transparent: true, depthWrite: false }));
  sprite.scale.set(2.7,0.61,1); return sprite;
}

const orbitLines = new Map(), planetMeshes = new Map(), planetLabels = new Map();
const planetNames = Object.keys(elements).filter(n => n !== "Earth");
const order = ["Mercury","Venus","Earth","Mars","Jupiter","Saturn","Uranus","Neptune"];
for (const name of order) {
  const mesh = new THREE.Mesh(new THREE.SphereGeometry(radii[name], 28, 20), new THREE.MeshStandardMaterial({ color: colors[name], roughness: 0.8, metalness: 0.02, emissive: colors[name], emissiveIntensity: 0.07 }));
  const label = textSprite(name);
  scene.add(mesh, label); planetMeshes.set(name, mesh); planetLabels.set(name,label);
  const line = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xe8bd74, transparent: true, opacity: 0.25 }));
  scene.add(line); orbitLines.set(name,line);
}

const moonOrbit = new THREE.Line(new THREE.BufferGeometry(), new THREE.LineBasicMaterial({ color: 0xb9c9e2, transparent: true, opacity: 0.4 }));
scene.add(moonOrbit);
const moon = new THREE.Mesh(new THREE.SphereGeometry(0.075, 20, 14), new THREE.MeshStandardMaterial({ color: 0xd6dce5, roughness: 0.95 }));
scene.add(moon); const moonLabel = textSprite("Moon · orbit enlarged"); scene.add(moonLabel);

function orbitPoints(name, year, steps=240) {
  const q=elements[name], T=(year-2000)/100;
  const L=q[6]+q[7]*T, peri=q[8]+q[9]*T;
  const points=[];
  for(let i=0;i<=steps;i++) points.push(world(planetPosition(name,year,i/steps*360 + peri - L)));
  return points;
}

function setLine(line, points) {
  line.geometry.dispose(); line.geometry = new THREE.BufferGeometry().setFromPoints(points);
}

function routeControlPoints() {
  const start = world(planetPosition("Earth",2026));
  const end = world(planetPosition("Earth",-5));
  const out0 = start.clone().normalize(); const out1=end.clone().normalize();
  start.addScaledVector(out0,0.13); end.addScaledVector(out1,0.13);
  const c1=start.clone().addScaledVector(out0,2.3).add(new THREE.Vector3(0,2.0,0));
  const c2=end.clone().addScaledVector(out1,2.3).add(new THREE.Vector3(0,2.0,0));
  return [start,c1,c2,end];
}
const routeControls=routeControlPoints();
const routeCurve = new THREE.CubicBezierCurve3(...routeControls);
function bezier(u) { return routeCurve.getPoint(u); }
const route = new THREE.Mesh(new THREE.TubeGeometry(routeCurve,260,0.075,8,false), new THREE.MeshBasicMaterial({ color:0x7de8df, transparent:true, opacity:0.96 }));
scene.add(route);
const argo = new THREE.Mesh(new THREE.SphereGeometry(0.19,28,20), new THREE.MeshBasicMaterial({ color: 0x7de8df }));
scene.add(argo); const argoLabel=textSprite("A.R.G.O.","#8ff9ef"); scene.add(argoLabel);
const endpoint = new THREE.Mesh(new THREE.SphereGeometry(0.12,20,16), new THREE.MeshBasicMaterial({ color: 0xffa76c })); scene.add(endpoint);
const endpointLabel=textSprite("6 BCE · Earth vicinity","#ffd0ad"); scene.add(endpointLabel);
endpoint.position.copy(routeControls[3]); endpointLabel.position.copy(endpoint.position).add(new THREE.Vector3(0,0.6,0));

let currentYear=Number(yearSlider.value), playing=false, then=0, drag=null;
function yearText(y) { return y <= 0 ? `${1-y} BCE` : `${y} CE`; }
function moonVector(year) {
  const d=(year-2000)*365.2422;
  const mean=115.3654 + 13.0649929509*d;
  const E=solveKepler(mean,0.0549), xv=60.2666*(Math.cos(E)-0.0549), yv=60.2666*Math.sqrt(1-0.0549**2)*Math.sin(E);
  const v=Math.atan2(yv,xv), n=rad(125.1228-0.0529538083*d), w=rad(318.0634+0.1643573223*d);
  const u=v+w, inc=rad(5.1454), r=60.2666*(1-0.0549*Math.cos(E))*6371/149597870.7;
  return [r*(Math.cos(n)*Math.cos(u)-Math.sin(n)*Math.sin(u)*Math.cos(inc)),r*(Math.sin(n)*Math.cos(u)+Math.cos(n)*Math.sin(u)*Math.cos(inc)),r*Math.sin(u)*Math.sin(inc)];
}

function update(year) {
  currentYear=year; yearSlider.value=String(year); yearLabel.value=yearText(year); yearLabel.textContent=yearText(year); dateLabel.textContent=yearText(year);
  for(const name of order) {
    const p=world(planetPosition(name,year));
    const mesh=planetMeshes.get(name), label=planetLabels.get(name);
    mesh.position.copy(p); label.position.copy(p).add(new THREE.Vector3(0,radii[name]+0.34,0));
    setLine(orbitLines.get(name),orbitPoints(name,year));
  }
  const e=planetMeshes.get("Earth").position;
  const m=worldLinear(moonVector(year)); m.multiplyScalar(60).add(e);
  moon.position.copy(m); moonLabel.position.copy(m).add(new THREE.Vector3(0,0.26,0));
  const mCircle=[]; for(let i=0;i<=80;i++){ const a=i/80*Math.PI*2; mCircle.push(e.clone().add(new THREE.Vector3(Math.cos(a)*0.32,0.04,Math.sin(a)*0.32))); }
  setLine(moonOrbit,mCircle);
  if(year <= 2026 && year >= -5) {
    const u=(2026-year)/(2026+5); argo.visible=true; argo.position.copy(bezier(u)); argoLabel.visible=year!==-5; argoLabel.position.copy(argo.position).add(new THREE.Vector3(0.8,0.6,0.4));
    playButton.disabled=year<=-5 || reduceMotion.matches;
    status.textContent=year===-5 ? "A.R.G.O. is at the 6 BCE scenario endpoint. The curve is continuous but has not been dynamically integrated or collision-screened." : year===2026 ? "A.R.G.O. is at the 2026 CE departure. Play or scrub backward toward the 6 BCE scenario endpoint; no collision clearance is claimed." : "A.R.G.O. follows the continuous illustrative curve from 2026 CE toward the 6 BCE scenario endpoint; no collision clearance is claimed.";
  } else {
    argo.visible=false; argoLabel.visible=false; playButton.disabled=true;
    status.textContent="The planetary model continues; this date is outside A.R.G.O.'s displayed 2026-to-6 BCE route interval.";
  }
}

const resize = () => { const w=viewport.clientWidth,h=viewport.clientHeight; renderer.setSize(w,h,false); camera.aspect=w/h; camera.updateProjectionMatrix(); };
new ResizeObserver(resize).observe(viewport); resize(); update(currentYear);

let theta=0.48, phi=0.92, distance=72;
function orient() { phi=Math.max(0.18,Math.min(Math.PI-0.18,phi)); camera.position.set(distance*Math.sin(phi)*Math.sin(theta),distance*Math.cos(phi),distance*Math.sin(phi)*Math.cos(theta)); camera.lookAt(0,0,0); }
orient();
renderer.domElement.addEventListener("pointerdown",e=>{drag={x:e.clientX,y:e.clientY};renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener("pointermove",e=>{if(!drag)return;theta-=(e.clientX-drag.x)*0.006;phi-=(e.clientY-drag.y)*0.006;drag={x:e.clientX,y:e.clientY};orient();});
renderer.domElement.addEventListener("pointerup",()=>{drag=null;});
renderer.domElement.addEventListener("wheel",e=>{distance=Math.max(25,Math.min(120,distance*Math.exp(e.deltaY*0.001)));orient();},{passive:true});
yearSlider.addEventListener("input",()=>update(Number(yearSlider.value)));
playButton.addEventListener("click",()=>{playing=!playing;playButton.textContent=playing?"Pause":"Play";playButton.setAttribute("aria-label",playing?"Pause time progression":"Play time progression");});
if(reduceMotion.matches){playButton.disabled=true;playButton.textContent="Use time slider";playButton.setAttribute("aria-label","Time slider available; automatic motion disabled by reduced-motion preference");}
function animate(now){requestAnimationFrame(animate);if(playing&&!reduceMotion.matches){if(now-then>180){then=now;if(currentYear<=-5){playing=false;playButton.textContent="Arrived";playButton.disabled=true;}else update(currentYear-1);}}renderer.render(scene,camera);}
requestAnimationFrame(animate);
</script>
</body>
</html>
