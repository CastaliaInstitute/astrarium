name: Build and publish the interactive time-travel book

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'scripts/estimate_two_bubble_ctc.py'
      - 'scripts/estimate_earth_target_state_3d.py'
      - 'scripts/estimate_saucer_bubble_source.py'
      - 'scripts/solve_two_bubble_encounter.py'
      - 'requirements-jupyter-book.txt'
      - '.github/workflows/publish-time-travel-book.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: publish-time-travel-book
  cancel-in-progress: true

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the book source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install book dependencies
        run: python -m pip install -r requirements-jupyter-book.txt

      - name: Build book and execute notebooks
        run: jupyter-book build docs

      - name: Check out GitHub Pages branch
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: pages
          fetch-depth: 0

      - name: Publish book under /time-travel-book
        run: |
          rm -rf pages/time-travel-book
          mkdir -p pages/time-travel-book
          cp -a "$GITHUB_WORKSPACE/docs/_build/html/." pages/time-travel-book/

      - name: Commit and push the Pages update
        working-directory: pages
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add time-travel-book
          if git diff --cached --quiet; then
            echo "The interactive time-travel book is already current."
            exit 0
          fi
          git commit -m "Publish interactive time-travel book"
          git push origin HEAD:gh-pages
