<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
  <meta name="theme-color" content="#02040a">
  <title>Atlas · Probe Flight</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#02040a;color:#f4e7d1;font:14px system-ui,sans-serif}
    #view{position:absolute;inset:0}canvas{display:block;width:100%;height:100%}
    #hud{position:absolute;left:3vw;top:3vh;padding:14px 18px;border-left:3px solid #ff9c00;background:#050710b8;min-width:260px;pointer-events:none}
    #kicker{font-size:11px;letter-spacing:.22em;color:#ff9c00;text-transform:uppercase}#title{font-size:clamp(22px,3vw,40px);letter-spacing:.08em;text-transform:uppercase;margin:4px 0}
    #phase,#coords,#data{font:12px ui-monospace,monospace;color:#d7c8ac;margin-top:5px}#data{color:#ffcf7d;max-width:38vw;line-height:1.5}
    #reticle{position:absolute;left:50%;top:50%;width:22px;height:22px;transform:translate(-50%,-50%);opacity:.6;pointer-events:none}
    #reticle:before,#reticle:after{content:"";position:absolute;background:#ffca70}#reticle:before{left:10px;top:0;width:1px;height:22px}#reticle:after{left:0;top:10px;width:22px;height:1px}
    #error{position:absolute;left:50%;bottom:4vh;transform:translateX(-50%);padding:8px 12px;color:#ff9a78;background:#190c0c;border:1px solid #713d2a;display:none}
  </style>
</head>
<body>
  <div id="view"></div><div id="reticle"></div>
  <section id="hud"><div id="kicker">Atlas · Probe navigation</div><div id="title">Awaiting mission</div><div id="phase">—</div><div id="coords">—</div><div id="data">Three.js projector renderer ready</div></section>
  <div id="error"></div>
  <script type="module" src="/terrain-projector.js"></script>
</body>
</html>
